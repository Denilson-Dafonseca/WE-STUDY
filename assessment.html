<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Assessment - We Study</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav style="background: Blue" class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-brain me-2"></i>
                <span class="fw-bold">We Study</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="logout()">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="text-center mb-5">
                    <h1 class="display-4 fw-bold mb-3">Learning Assessment</h1>
                    <p class="lead">Help us understand your learning style so we can create your personalized study plan.</p>
                </div>
                
                <div class="card shadow-lg">
                    <div class="card-body p-5">
                        <form id="assessmentForm">
                            <div class="mb-4">
                                <label class="form-label fw-bold">What is your primary learning style?</label>
                                <select class="form-select" id="learningStyle" required>
                                    <option value="">Select your learning style...</option>
                                    <option value="visual">Visual Learner (learns best by seeing)</option>
                                    <option value="auditory">Auditory Learner (learns best by hearing)</option>
                                    <option value="reading">Reading/Writing Learner (learns best by reading and writing)</option>
                                    <option value="kinesthetic">Kinesthetic Learner (learns best by doing)</option>
                                    <option value="mixed">Mixed/Combination</option>
                                </select>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-bold">What is your current academic level?</label>
                                <select class="form-select" id="difficultyLevel" required>
                                    <option value="">Select your level...</option>
                                    <option value="beginner">Beginner</option>
                                    <option value="intermediate">Intermediate</option>
                                    <option value="advanced">Advanced</option>
                                </select>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-bold">How long can you concentrate effectively?</label>
                                <select class="form-select" id="concentrationLevel" required>
                                    <option value="">Select concentration level...</option>
                                    <option value="low">Low (20-30 minutes)</option>
                                    <option value="medium">Medium (45-60 minutes)</option>
                                    <option value="high">High (90+ minutes)</option>
                                </select>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-bold">What subjects are you studying?</label>
                                <input type="text" class="form-control" id="subjects" placeholder="e.g., Mathematics, English, Biology, History" required>
                                <div class="form-text">Enter subjects separated by commas</div>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-bold">What are your academic goals?</label>
                                <textarea class="form-control" id="goals" rows="3" placeholder="What do you want to achieve?"></textarea>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-bold">What challenges do you face when studying?</label>
                                <textarea class="form-control" id="challenges" rows="3" placeholder="Be honest - this helps us address your specific obstacles."></textarea>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-bold">How many hours can you study per day?</label>
                                <input type="number" class="form-control" id="studyHours" step="0.5" min="0.5" max="12" value="2" required>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-robot me-2"></i>Generate My AI Study Plan
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Check authentication
        checkAuth();
        
        // Handle form submission
        document.getElementById('assessmentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const assessmentData = {
                learningStyle: document.getElementById('learningStyle').value,
                difficultyLevel: document.getElementById('difficultyLevel').value,
                concentrationLevel: document.getElementById('concentrationLevel').value,
                subjects: document.getElementById('subjects').value,
                goals: document.getElementById('goals').value,
                challenges: document.getElementById('challenges').value,
                studyHours: document.getElementById('studyHours').value
            };
            
            // Validate required fields
            if (!assessmentData.learningStyle || !assessmentData.difficultyLevel || 
                !assessmentData.concentrationLevel || !assessmentData.subjects) {
                alert('Please fill in all required fields!');
                return;
            }
            
            // Save assessment and generate study plan
            if (saveAssessment(assessmentData)) {
                alert('Your AI study plan has been generated successfully!');
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
